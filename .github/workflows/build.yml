name: Compilar apps (Windows y Android)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1 pytest

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Descargar modelo de voz en español (Vosk)
        shell: pwsh
        run: |
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip -OutFile model.zip
          Expand-Archive model.zip -DestinationPath tmpmodel
          Move-Item tmpmodel/vosk-model-small-es-0.42 model

      - name: Empaquetar con PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name EnsayoPitch
          --icon ensayo/assets/icon.ico
          --add-data "ensayo/assets;assets"
          --add-data "model;model"
          --collect-all vosk
          --collect-all _sounddevice_data
          --hidden-import PySide6.QtTextToSpeech
          --hidden-import win32com.client
          --hidden-import pythoncom
          run.py

      - name: Probar el ejecutable
        shell: pwsh
        run: |
          $p = Start-Process dist/EnsayoPitch/EnsayoPitch.exe -ArgumentList "--selftest","selftest.json" -PassThru -Wait
          Get-Content selftest.json
          $r = Get-Content selftest.json | ConvertFrom-Json
          if ($r.vosk -ne "ok") { throw "El modelo de voz no cargó" }
          if ($r.deck.sections -ne 13) { throw "No se leyó bien la presentación" }

      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/EnsayoPitch -DestinationPath EnsayoPitch-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: EnsayoPitch-Windows.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copiar presentación, láminas y modelo de voz a la app
        run: |
          A=android/app/src/main/assets
          mkdir -p $A/slides
          cp ensayo/assets/default.pptx $A/
          cp ensayo/assets/slides/*.jpg $A/slides/
          cp -r ensayo/assets/plantillas $A/
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q model.zip
          mv vosk-model-small-es-0.42 $A/model-es
          echo "vosk-model-small-es-0.42" > $A/model-es/uuid
          du -sh $A/model-es

      - name: Pruebas y compilación
        run: gradle -p android --no-daemon testDebugUnitTest assembleRelease

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk EnsayoPitch-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: EnsayoPitch-Android.apk

  publicar:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Leer versión
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Ensayo Pitch ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/windows/EnsayoPitch-Windows.zip
            out/android/EnsayoPitch-Android.apk
            docs/Tutorial_Ensayo_Pitch_v2.pdf
            docs/Tutorial_Ensayo_Pitch.pdf
            ensayo/assets/plantillas/Plantilla_Guion.docx
            ensayo/assets/plantillas/Plantilla_Guion.txt
            ensayo/assets/plantillas/Guion_ejemplo_FireProof.docx
          body: |
            **Windows:** descarga **EnsayoPitch-Windows.zip**, descomprímelo y abre `EnsayoPitch.exe`. Si sale "Windows protegió su PC": *Más información* → *Ejecutar de todas formas*.

            **Android:** descarga **EnsayoPitch-Android.apk** desde el teléfono y ábrelo. Si pide permiso para instalar apps de origen desconocido, actívalo para tu navegador o para Archivos.

            El paso a paso de la 2.0 está en **Tutorial_Ensayo_Pitch_v2.pdf** (el de la 1.0 sigue en Tutorial_Ensayo_Pitch.pdf).

            **Versión 2:** para ensayar otra presentación, rellena **Plantilla_Guion.docx** (o la .txt) y cárgala en la app con «Guion…», junto con el PowerPoint. **Guion_ejemplo_FireProof.docx** es un ejemplo ya relleno.
